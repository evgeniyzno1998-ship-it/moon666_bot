<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 Moon666 Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:           #0b0c10;
            --bg-2:         #0d0e17;
            --bg-card:      #111219;
            --bg-hover:     #161824;
            --bg-inset:     rgba(255,255,255,.03);
            --border:       #1c1e2e;
            --border-light: #252840;
            --sidebar-bg:   #0d0e17;

            --gold:         #f0b90b;
            --gold-2:       #ffe066;
            --gold-dim:     rgba(240,185,11,.10);
            --gold-glow:    rgba(240,185,11,.22);
            --green:        #0ecb81;
            --green-dim:    rgba(14,203,129,.10);
            --blue:         #2196f3;
            --blue-dim:     rgba(33,150,243,.10);
            --purple:       #a78bfa;
            --purple-dim:   rgba(167,139,250,.10);
            --red:          #f6465d;
            --red-dim:      rgba(246,70,93,.10);

            --text:         #eaecef;
            --text-2:       #848e9c;
            --text-3:       #5a6275;

            --r:            14px;
            --r-sm:         9px;
            --shadow:       0 8px 28px rgba(0,0,0,.36);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: var(--gold-glow); }
        a { color: inherit; }

        /* ─── SIDEBAR ─────────────────────────────── */
        .sidebar {
            width: 232px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 40;
        }
        .sidebar-brand {
            padding: 22px 18px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }
        .brand-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-2) 100%);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 22px var(--gold-glow), 0 2px 8px rgba(0,0,0,.4);
            flex-shrink: 0;
        }
        .brand-name { font-weight: 700; font-size: 15.5px; letter-spacing: -.3px; }
        .brand-sub  { font-size: 10px; color: var(--text-3); font-weight: 600; letter-spacing: .6px; }

        .nav { flex: 1; padding: 12px 12px 0; }
        .nav-section { font-size: 10px; font-weight: 700; text-transform: uppercase;
                       letter-spacing: 1.1px; color: var(--text-3); padding: 12px 10px 6px; }

        .sidebar a {
            display: flex; align-items: center; gap: 11px;
            padding: 9.5px 11px;
            color: var(--text-2);
            text-decoration: none;
            font-size: 13.5px; font-weight: 500;
            border-radius: var(--r-sm);
            margin-bottom: 2px;
            transition: background .12s, color .12s;
            position: relative;
        }
        .nav-ico { width: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .nav-ico svg { width: 17px; height: 17px; }
        .sidebar a:hover { background: var(--bg-inset); color: var(--text); }
        .sidebar a.active { background: var(--gold-dim); color: var(--gold); }
        .sidebar a.active::before {
            content: ''; position: absolute; left: -12px; top: 7px; bottom: 7px;
            width: 3px; background: var(--gold); border-radius: 0 3px 3px 0;
        }
        .nav-badge {
            margin-left: auto; font-size: 10.5px; font-weight: 700;
            background: var(--gold); color: #0a0b10;
            border-radius: 20px; padding: 1px 7px; min-width: 18px; text-align: center;
        }

        .sidebar-foot { padding: 12px; border-top: 1px solid var(--border); margin-top: auto; }
        .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px 12px; }
        .avatar {
            width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; color: #0a0b10;
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
        }
        .sidebar-foot a {
            display: flex; align-items: center; gap: 11px;
            padding: 9px 11px; color: var(--text-3); text-decoration: none;
            font-size: 13px; border-radius: var(--r-sm); transition: all .12s;
        }
        .sidebar-foot a:hover { background: var(--red-dim); color: var(--red); }

        /* ─── MAIN ────────────────────────────────── */
        .main { flex: 1; padding: 28px 32px 60px; overflow-y: auto; min-width: 0; }
        .main-inner { max-width: 1180px; margin: 0 auto; }

        .pg-head { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
        .pg-ico {
            width: 44px; height: 44px;
            background: var(--gold-dim);
            border: 1px solid rgba(240,185,11,.22);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--gold); flex-shrink: 0;
        }
        .pg-ico svg { width: 21px; height: 21px; }
        .pg-title { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
        .pg-sub { font-size: 12.5px; color: var(--text-3); margin-top: 1px; }

        /* ─── CARDS ───────────────────────────────── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 20px;
            margin-bottom: 14px;
            transition: border-color .18s, box-shadow .18s;
        }
        .card.flush { padding: 0; overflow: hidden; }
        .card-hd { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; }
        .card-hd .ico { color: var(--text-2); display: flex; }
        .card-hd .ico svg { width: 16px; height: 16px; }
        .card-ttl {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-2); white-space: nowrap;
        }

        /* ─── KPI GRID ────────────────────────────── */
        .kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 14px; }
        .kpi {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: transform .18s, border-color .18s, box-shadow .18s;
        }
        .kpi:hover { border-color: var(--border-light); transform: translateY(-3px); box-shadow: var(--shadow); }
        .kpi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .kpi-lbl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .9px; color: var(--text-3); }
        .kpi-ico { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
        .kpi-ico svg { width: 16px; height: 16px; }
        .kpi-val { font-size: 30px; font-weight: 700; letter-spacing: -1.2px; line-height: 1; font-variant-numeric: tabular-nums; }
        .kpi-sub { font-size: 11.5px; color: var(--text-3); margin-top: 10px; }
        .kpi-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; opacity: .55; }

        /* ─── TABLES ──────────────────────────────── */
        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 11px 18px;
            font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .9px;
            color: var(--text-3); border-bottom: 1px solid var(--border);
            text-align: left; white-space: nowrap;
        }
        td { padding: 13px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr.clickable { cursor: pointer; }
        tbody tr:hover td { background: var(--bg-inset); }
        .mono { font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
        .amt { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
        .tnum { font-variant-numeric: tabular-nums; }

        /* user cell */
        .ucell { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .ucell .av { width: 32px; height: 32px; border-radius: 9px; font-size: 12px; flex-shrink: 0;
                     display: flex; align-items: center; justify-content: center; font-weight: 700; color: #0a0b10;
                     background: linear-gradient(135deg, var(--gold), var(--gold-2)); }
        .ucell .nm { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ucell .un { color: var(--text-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ─── BADGES ──────────────────────────────── */
        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 3.5px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 600; white-space: nowrap;
        }
        .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .badge-pending  { background: var(--gold-dim);  color: var(--gold); }
        .badge-approved { background: var(--green-dim); color: var(--green); }
        .badge-rejected { background: var(--red-dim);   color: var(--red); }
        .badge-muted    { background: var(--bg-inset);  color: var(--text-3); }
        .badge-green    { background: var(--green-dim); color: var(--green); }
        .badge-red      { background: var(--red-dim);   color: var(--red); }
        .badge-blue     { background: var(--blue-dim);  color: var(--blue); }
        .badge-purple   { background: var(--purple-dim); color: var(--purple); }

        /* ─── BUTTONS ─────────────────────────────── */
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 8px 15px; border-radius: var(--r-sm); border: 1px solid transparent;
            cursor: pointer; font-size: 12.5px; font-weight: 600;
            text-decoration: none; transition: all .15s; font-family: inherit; white-space: nowrap;
        }
        .btn svg { width: 14px; height: 14px; }
        .btn-primary { background: var(--gold); color: #0a0b10; }
        .btn-primary:hover { filter: brightness(1.08); box-shadow: 0 0 18px var(--gold-glow); }
        .btn-green { background: var(--green-dim); color: var(--green); border-color: rgba(14,203,129,.22); }
        .btn-green:hover { background: rgba(14,203,129,.18); }
        .btn-red { background: var(--red-dim); color: var(--red); border-color: rgba(246,70,93,.22); }
        .btn-red:hover { background: rgba(246,70,93,.18); }
        .btn-ghost { background: var(--bg-inset); color: var(--text-2); border-color: var(--border); }
        .btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
        .btn-sm { padding: 5.5px 11px; font-size: 11.5px; }

        /* ─── PERIOD / FILTER BAR ─────────────────── */
        .period-bar {
            display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
            margin-bottom: 22px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: var(--r); padding: 7px 10px;
        }
        .prd-btn {
            padding: 6px 14px; border-radius: var(--r-sm); background: transparent;
            color: var(--text-2); border: none; cursor: pointer; font-size: 13px;
            font-weight: 500; font-family: inherit; text-decoration: none; transition: all .12s;
        }
        .prd-btn:hover { background: var(--bg-inset); color: var(--text); }
        .prd-btn.active { background: var(--gold-dim); color: var(--gold); font-weight: 600; }
        .prd-sep { width: 1px; height: 20px; background: var(--border); margin: 0 5px; }
        .prd-ico { display: flex; padding: 0 6px; color: var(--text-3); }
        .prd-ico svg { width: 15px; height: 15px; }

        /* ─── INPUTS ──────────────────────────────── */
        input[type="text"], input[type="password"], input[type="date"],
        input[type="datetime-local"], input[type="number"], select {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 8px 13px; border-radius: var(--r-sm); font-size: 13px; font-family: inherit;
            outline: none; transition: border-color .15s, box-shadow .15s;
        }
        input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
        input::placeholder { color: var(--text-3); }
        .search-wrap { position: relative; }
        .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
                           width: 15px; height: 15px; color: var(--text-3); pointer-events: none; }
        .search-wrap input { padding-left: 36px; }

        /* progress / bars */
        .track-bar { background: var(--bg-inset); border-radius: 6px; overflow: hidden; }
        .track-fill { height: 100%; border-radius: 6px; }

        /* ─── EMPTY STATE ─────────────────────────── */
        .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
                 padding: 56px 24px; color: var(--text-3); }
        .empty svg { width: 40px; height: 40px; margin-bottom: 14px; opacity: .4; }
        .empty-txt { font-size: 13px; }

        /* ─── ALERTS ──────────────────────────────── */
        .alert { padding: 12px 16px; border-radius: var(--r-sm); margin-bottom: 16px; font-size: 13px;
                 display: flex; align-items: center; gap: 9px; }
        .alert svg { width: 16px; height: 16px; flex-shrink: 0; }
        .alert-ok  { background: var(--green-dim); color: var(--green); border: 1px solid rgba(14,203,129,.25); }
        .alert-err { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(246,70,93,.25); }

        /* helpers */
        .muted { color: var(--text-3); }
        .t2 { color: var(--text-2); }
        .right { margin-left: auto; }
        .row { display: flex; align-items: center; }

        /* ─── SCROLLBAR ───────────────────────────── */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

        /* ─── MOBILE ──────────────────────────────── */
        .hamburger { display: none; background: var(--bg-card); border: 1px solid var(--border);
                     color: var(--text); border-radius: var(--r-sm); padding: 8px 11px; cursor: pointer; margin-bottom: 18px; }
        .hamburger svg { width: 18px; height: 18px; display: block; }
        @media (max-width: 860px) {
            .sidebar { position: fixed; left: 0; top: 0; height: 100vh; transform: translateX(-100%);
                       transition: transform .25s ease; z-index: 1000; box-shadow: 4px 0 28px rgba(0,0,0,.5); }
            .sidebar.open { transform: translateX(0); }
            .main { width: 100%; padding: 18px 16px 50px; }
            .hamburger { display: inline-flex; }
            .kpi-grid { grid-template-columns: 1fr 1fr !important; }
            table { font-size: 12px; }
            thead th, td { padding: 10px 12px; }
            .pg-title { font-size: 18px; }
        }
        @media (max-width: 540px) { .kpi-grid { grid-template-columns: 1fr !important; } }

        /* ─── SVG icon symbol sprite ──────────────── */
        .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7;
              stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">🌙</div>
        <div>
            <div class="brand-name">Moon666</div>
            <div class="brand-sub">ПАНЕЛЬ АДМИНА</div>
        </div>
    </div>
    <nav class="nav">
        <div class="nav-section">Обзор</div>
        <a href="/" class="{% if active == 'dashboard' %}active{% endif %}">
            <span class="nav-ico"><svg class="ic"><use href="#i-dashboard"/></svg></span> Дашборд
        </a>
        <a href="/analytics" class="{% if active == 'analytics' %}active{% endif %}">
            <span class="nav-ico"><svg class="ic"><use href="#i-analytics"/></svg></span> Аналитика
        </a>
        <div class="nav-section">Управление</div>
        <a href="/withdrawals" class="{% if active == 'withdrawals' %}active{% endif %}">
            <span class="nav-ico"><svg class="ic"><use href="#i-withdrawals"/></svg></span> Выводы
            {% if pending_count and active != 'withdrawals' %}<span class="nav-badge">{{ pending_count }}</span>{% endif %}
        </a>
        <a href="/users" class="{% if active == 'users' %}active{% endif %}">
            <span class="nav-ico"><svg class="ic"><use href="#i-users"/></svg></span> Пользователи
        </a>
        <a href="/campaigns" class="{% if active == 'campaigns' %}active{% endif %}">
            <span class="nav-ico"><svg class="ic"><use href="#i-campaigns"/></svg></span> Кампании
        </a>
        <div class="nav-section">Настройка</div>
        <a href="/settings" class="{% if active == 'settings' %}active{% endif %}">
            <span class="nav-ico"><svg class="ic"><use href="#i-settings"/></svg></span> Настройки
        </a>
    </nav>
    <div class="sidebar-foot">
        <div class="sidebar-user">
            <div class="avatar">AD</div>
            <div style="min-width:0">
                <div style="font-weight:600;font-size:13px">admin</div>
                <div class="muted" style="font-size:11px">Администратор</div>
            </div>
        </div>
        <a href="/logout"><span class="nav-ico"><svg class="ic"><use href="#i-logout"/></svg></span> Выйти</a>
    </div>
</div>

<div class="main">
    <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Меню">
        <svg class="ic"><use href="#i-menu"/></svg>
    </button>
    <div class="main-inner">
        {% block content %}{% endblock %}
    </div>
</div>

<script>
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
document.addEventListener('click', function(e) {
    var sidebar = document.getElementById('sidebar');
    var hamburger = document.getElementById('hamburger');
    if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && e.target !== hamburger && !hamburger.contains(e.target)) {
        sidebar.classList.remove('open');
    }
});
</script>
</body>
</html>
