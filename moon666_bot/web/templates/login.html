<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon666 Admin — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0b0c10; color: #eaecef;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: ''; position: fixed; width: 560px; height: 560px;
            background: radial-gradient(circle, rgba(240,185,11,.07) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -60%); pointer-events: none;
        }
        body::after {
            content: ''; position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
            background-size: 42px 42px; pointer-events: none;
        }
        .login-wrap { width: 360px; position: relative; z-index: 1; }
        .logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; gap: 14px; }
        .logo-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #f0b90b, #ffe066);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 29px; box-shadow: 0 0 40px rgba(240,185,11,.35), 0 4px 20px rgba(0,0,0,.5);
        }
        .logo-title { font-size: 23px; font-weight: 700; letter-spacing: -.5px; text-align: center; }
        .logo-sub { font-size: 11px; color: #5a6275; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; text-align: center; margin-top: 2px; }
        .card {
            background: #111219; border: 1px solid #1c1e2e; border-radius: 18px;
            padding: 30px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
        }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 22px; color: #848e9c; text-align: center; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: #5a6275; margin-bottom: 7px; }
        input {
            width: 100%; background: #0b0c10; border: 1px solid #1c1e2e; color: #eaecef;
            padding: 12px 14px; border-radius: 10px; font-size: 14px; font-family: inherit;
            outline: none; transition: border-color .15s, box-shadow .15s;
        }
        input:focus { border-color: #f0b90b; box-shadow: 0 0 0 3px rgba(240,185,11,.12); }
        input::placeholder { color: #3d4355; }
        .btn-submit {
            width: 100%; margin-top: 8px; padding: 13px;
            background: #f0b90b; color: #0a0b10; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
            transition: all .15s; letter-spacing: .2px; display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        .btn-submit:hover { filter: brightness(1.08); box-shadow: 0 0 24px rgba(240,185,11,.35); }
        .btn-submit:active { transform: scale(.99); }
        .btn-submit svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .error-msg {
            display: flex; align-items: center; gap: 8px;
            background: rgba(246,70,93,.1); border: 1px solid rgba(246,70,93,.25);
            color: #f6465d; padding: 11px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="logo">
        <div class="logo-icon">🌙</div>
        <div>
            <div class="logo-title">Moon666</div>
            <div class="logo-sub">Admin Dashboard</div>
        </div>
    </div>
    <div class="card">
        <div class="card-title">Введите данные для входа</div>
        {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}
        <form method="post">
            <div class="field">
                <label>Логин</label>
                <input type="text" name="username" placeholder="admin" required autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">
                Войти
                <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
        </form>
    </div>
</div>
</body>
</html>
